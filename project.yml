name: YYReader
options:
  bundleIdPrefix: com.yyreader
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.5
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: 15.0
    CLANG_ENABLE_MODULES: YES
targets:
  YYReader:
    type: application
    platform: macOS
    sources:
      - path: YYReader
    dependencies:
      - package: SwiftSoup
    entitlements:
      path: YYReader/YYReader.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yyreader.app
        PRODUCT_NAME: YYReader
        ARCHS: arm64
        INFOPLIST_KEY_CFBundleDisplayName: YYReader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.1.2
        CURRENT_PROJECT_VERSION: 4
    info:
      path: YYReader/Info.plist
      properties:
        CFBundleDisplayName: YYReader
        CFBundleName: YYReader
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.books
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  YYReaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: YYReaderTests
        excludes:
          - Fixtures
    resources:
      - path: YYReaderTests/Fixtures
    dependencies:
      - target: YYReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yyreader.app.tests
        GENERATE_INFOPLIST_FILE: YES
  YYReaderUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: YYReaderUITests
    dependencies:
      - target: YYReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yyreader.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  YYReader:
    build:
      targets:
        YYReader: all
        YYReaderTests: [test]
        YYReaderUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - YYReaderTests
        - YYReaderUITests
